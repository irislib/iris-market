name: Release contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check pinned inputs and artifact acceptance contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/release-build-inputs.py --check
          python3 scripts/android-release-inputs.py --check
          python3 scripts/test_alpha_release.py -v
          python3 scripts/native-alpha.py --help
          node --test scripts/publish-alpha.test.mjs
      # Native builds, signing and publication are separately owned release gates.
