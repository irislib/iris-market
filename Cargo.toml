[workspace]
members = ["crates/market-core", "crates/market-app", "crates/market-cli", "crates/bindgen"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
nostr = { version = "=0.44.8", default-features = false, features = ["std", "nip44"] }
nostr-sdk = "=0.44.1"
nostr-pubsub = "=0.1.20"
nostr-pubsub-relay = "=0.1.15"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
rusqlite = { version = "=0.31.0", features = ["bundled"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
url = "=2.5.8"
uuid = { version = "=1.23.1", features = ["v4"] }
uniffi = "=0.29.5"
tempfile = "=3.24.0"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
