name: IrisMarketMac
options:
  bundleIdPrefix: to.iris.market
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: to.iris.market
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "16"
    MARKET_RELEASE_VERSION: "0.1.4-alpha.5"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  IrisMarketMac:
    build:
      targets:
        IrisMarketMac: all
    run:
      config: Debug
  IrisMarketMacChecks:
    build:
      targets:
        IrisMarketMacChecks: [test]
    test:
      config: Debug
      targets:
        - IrisMarketMacChecks
targets:
  IrisMarketMac:
    type: application
    platform: macOS
    entitlements:
      path: .build/Market.entitlements
      properties:
        com.apple.security.device.camera: true
    sources:
      - path: ../shared/escrow
        type: folder
        buildPhase: resources
      - path: Assets.xcassets
      - path: ../ios/Sources
      - path: ../ios/Bindings
        excludes:
          - "*.h"
          - "*.modulemap"
    settings:
      base:
        PRODUCT_NAME: IrisMarket
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
        ENABLE_APP_SANDBOX: NO
        SWIFT_INCLUDE_PATHS: '$(inherited) "$(PROJECT_DIR)/.build/headers"'
        OTHER_LDFLAGS: '$(inherited) "$(MARKET_MACOS_STATIC_LIB)" -framework Security -framework SystemConfiguration -lresolv'
        DEBUG_INFORMATION_FORMAT: dwarf
        COMPILER_INDEX_STORE_ENABLE: NO
  # Update flow and installer only: no host app, Rust core or profile.
  IrisMarketMacChecks:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../ios/Sources/MarketUpdateFlow.swift
      - path: ../ios/Sources/MarketAppInstaller.swift
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: to.iris.market.checks
        GENERATE_INFOPLIST_FILE: YES
        COMPILER_INDEX_STORE_ENABLE: NO
